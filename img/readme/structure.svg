<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Structure imposée : bloc d'identification et 12 rubriques numérotées">
  <rect width="900" height="640" rx="18" fill="#12161F" stroke="#2A3140" stroke-width="2"/>
  <text x="40" y="52" font-family="Consolas,'JetBrains Mono',monospace" font-size="15" letter-spacing="3" fill="#F2CE6B">LA STRUCTURE IMPOSÉE</text>
  <text x="40" y="88" font-family="Georgia,'Playfair Display',serif" font-size="28" font-weight="700" fill="#ECEAE2">Une même trame pour les trois fiches</text>
  <line x1="82" y1="128" x2="82" y2="606" stroke="#8A6B24" stroke-width="2"/>
  <g font-family="Arial,'Atkinson Hyperlegible',sans-serif" font-size="18" fill="#ECEAE2">
    <g transform="translate(0,140)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#F2CE6B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">0</text><text x="116" y="6">Bloc d'identification (champs vierges)</text></g>
    <g transform="translate(0,177)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">1</text><text x="116" y="6">Cadre de référence</text></g>
    <g transform="translate(0,214)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">2</text><text x="116" y="6">Informations générales</text></g>
    <g transform="translate(0,251)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">3</text><text x="116" y="6">Objectifs pédagogiques</text><text x="560" y="6" fill="#F2CE6B" font-size="15">← la plus scrutée</text></g>
    <g transform="translate(0,288)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">4</text><text x="116" y="6">Matériel et supports</text></g>
    <g transform="translate(0,325)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">5</text><text x="116" y="6">Modalités et méthodes pédagogiques</text></g>
    <g transform="translate(0,362)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">6</text><text x="116" y="6">Déroulé détaillé et minuté</text><text x="560" y="6" fill="#F2CE6B" font-size="15">← le cœur de la fiche</text></g>
    <g transform="translate(0,399)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">7</text><text x="116" y="6">Évaluation des acquis</text></g>
    <g transform="translate(0,436)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">8</text><text x="116" y="6">Document remis aux participants (mémo A5)</text></g>
    <g transform="translate(0,473)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" fill="#F2CE6B">9</text><text x="116" y="6">Adaptation à l'accessibilité et au handicap</text></g>
    <g transform="translate(0,510)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#F2CE6B">10</text><text x="116" y="6">Posture et limites du médiateur</text><path d="M568 -9 L577 7 L559 7 Z" fill="none" stroke="#F0A98C" stroke-width="2" stroke-linejoin="round"/><text x="586" y="6" fill="#F0A98C" font-size="15">point disqualifiant</text></g>
    <g transform="translate(0,547)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#F2CE6B">11</text><text x="116" y="6">Ressources et références officielles</text></g>
    <g transform="translate(0,584)"><circle cx="82" cy="0" r="16" fill="#171C27" stroke="#C9A24B" stroke-width="2"/><text x="82" y="6" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#F2CE6B">12</text><text x="116" y="6">Bilan de la séance (à compléter après)</text></g>
  </g>
